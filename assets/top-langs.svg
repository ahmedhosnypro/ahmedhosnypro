<svg
  width="350"
  height="165"
  viewBox="0 0 350 165"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #38bdae;
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    * { animation-duration: 0s !important; animation-delay: 0s !important; }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#E4E2E2"
    width="349"
    fill="#1a1b27"
    stroke-opacity="0"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="300" height="8" fill="white" rx="5" />
      </mask>

      <rect mask="url(#rect-mask)" x="0" y="0" width="180" height="8" fill="#3178c6" />
      <rect mask="url(#rect-mask)" x="180" y="0" width="66" height="8" fill="#A97BFF" />
      <rect mask="url(#rect-mask)" x="246" y="0" width="30" height="8" fill="#b07219" />
      <rect mask="url(#rect-mask)" x="276" y="0" width="15" height="8" fill="#178600" />
      <rect mask="url(#rect-mask)" x="291" y="0" width="9" height="8" fill="#3572A5" />

      <g transform="translate(0, 25)">
        <circle cx="5" cy="6" r="5" fill="#3178c6" />
        <text x="15" y="10" class="lang-name">TypeScript 60.0%</text>
      </g>

      <g transform="translate(150, 25)">
        <circle cx="5" cy="6" r="5" fill="#A97BFF" />
        <text x="15" y="10" class="lang-name">Kotlin 22.0%</text>
      </g>

      <g transform="translate(0, 50)">
        <circle cx="5" cy="6" r="5" fill="#b07219" />
        <text x="15" y="10" class="lang-name">Java 10.0%</text>
      </g>

      <g transform="translate(150, 50)">
        <circle cx="5" cy="6" r="5" fill="#178600" />
        <text x="15" y="10" class="lang-name">C# 5.0%</text>
      </g>

      <g transform="translate(0, 75)">
        <circle cx="5" cy="6" r="5" fill="#3572A5" />
        <text x="15" y="10" class="lang-name">Python 3.0%</text>
      </g>
    </svg>
  </g>
</svg>
